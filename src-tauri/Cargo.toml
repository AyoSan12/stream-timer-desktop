[package]
name = "stream-timer-desktop"
version = "1.0.3"
description = "Stream Timer — Native Windows Subathon Countdown & Creator Finance Studio"
authors = ["Stream Timer"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
