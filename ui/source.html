<!doctype html>
<html lang="en" data-bg="__OBS_BG__"__OBS_BG_STYLE__>
<head>
<meta charset="utf-8">
<title>Stream Timer | OBS Source</title>
<link rel="stylesheet" href="/source.css">
</head>
<body data-bg="__OBS_BG__"__OBS_BG_STYLE__>
<main id="stage" class="stage" data-pos="__OBS_POS__">
  <section id="card" class="__OBS_CARD_CLASS__" style="__OBS_CARD_STYLE__" aria-live="off">
    <div id="creditToast" class="credit-toast" hidden></div>
    <div id="rushBadge" class="rush-badge"__OBS_RUSH_HIDDEN__>__OBS_RUSH_TEXT__</div>
    <div id="timerLabel" class="timer-label"__OBS_TIMER_HIDDEN__ style="__OBS_TIMER_LABEL_STYLE__">__OBS_TIMER_LABEL__</div>
    <div id="countdown" class="countdown" role="timer"__OBS_TIMER_HIDDEN__ style="__OBS_COUNTDOWN_STYLE__">__OBS_CLOCK__</div>
    <div id="totalRow" class="total-row"__OBS_TOTAL_HIDDEN__>
      <span id="totalLabel" class="total-label">__OBS_TOTAL_LABEL__</span>
      <span id="totalVal" class="total-val" style="__OBS_TOTAL_VAL_STYLE__">__OBS_TOTAL_VAL__</span>
    </div>
  </section>
</main>
<script>window.__INITIAL_OBS__ = __OBS_INIT_JSON__;</script>
<script type="module">
import { applySnapshot, remainingAt, formatSeconds, formatClock } from '/js/timer-client.js';
import { createTimerLink } from '/js/timer-link.js';

const qs = new URLSearchParams(window.location.search);
const bgOverride = qs.get('bg');
const popupOverride = qs.get('popup');
const obsScopeQs = new URLSearchParams();
if (qs.get('profile')) obsScopeQs.set('profile', qs.get('profile'));
if (qs.get('token')) obsScopeQs.set('token', qs.get('token'));
const obsScopeSuffix = obsScopeQs.toString() ? `?${obsScopeQs.toString()}` : '';

const stage = document.getElementById('stage');
const card = document.getElementById('card');
const rushBadge = document.getElementById('rushBadge');
const timerLabel = document.getElementById('timerLabel');
const countdown = document.getElementById('countdown');
const totalRow = document.getElementById('totalRow');
const totalLabel = document.getElementById('totalLabel');
const totalVal = document.getElementById('totalVal');
const creditToast = document.getElementById('creditToast');

const INIT = window.__INITIAL_OBS__ || null;
const defaultCfg = { timerName: 'Stream Timer', totalName: 'Total Added', showTimer: true, showTotal: true, showRush: true, bgMode: 'dark', bgColor: '#00ff00', textColor: '#ffffff', accentColor: '#2997ff', fontSize: 42, position: 'bottom-left', opacity: 92, popup: true, rushOn: false, rushLv: 1 };
let cfg = INIT && INIT.overlay ? { ...defaultCfg, ...INIT.overlay } : { ...defaultCfg };
let snap = INIT && INIT.snapshot ? applySnapshot(null, INIT.snapshot, performance.now()) : null;
let knownAppVersion = null;
let toastTimer = null;

function applyStyle() {
  const bgMode = cfg.bgMode || bgOverride || 'transparent';
  document.documentElement.dataset.bg = bgMode;
  document.body.dataset.bg = bgMode;
  if (bgMode === 'color' && typeof cfg.bgColor === 'string' && /^#[0-9a-fA-F]{6}$/.test(cfg.bgColor)) {
    document.documentElement.style.backgroundColor = cfg.bgColor;
    document.body.style.backgroundColor = cfg.bgColor;
  } else {
    document.documentElement.style.backgroundColor = '';
    document.body.style.backgroundColor = '';
  }

  stage.dataset.pos = cfg.position || 'bottom-left';
  const rawOp = Number(cfg.opacity);
  const op = Number.isFinite(rawOp) ? Math.min(100, Math.max(0, Math.round(rawOp))) : 92;
  card.classList.toggle('is-frameless', op === 0);
  card.style.backgroundColor = op === 0 ? 'transparent' : `rgba(29, 29, 31, ${(op / 100).toFixed(2)})`;

  rushBadge.hidden = !(cfg.rushOn && cfg.showRush);
  rushBadge.textContent = `BILLING RUSH LV.${cfg.rushLv || 1}`;
  timerLabel.hidden = !cfg.showTimer;
  countdown.hidden = !cfg.showTimer;
  timerLabel.textContent = cfg.rushOn ? 'BILLING RUSH' : (cfg.timerName || 'Stream Timer').toUpperCase();
  timerLabel.style.color = cfg.rushOn ? '#ffd60a' : (cfg.accentColor || '#2997ff');
  countdown.style.color = cfg.textColor || '#ffffff';
  countdown.style.fontSize = `${cfg.fontSize || 42}px`;
  if (cfg.fontFamily) countdown.style.fontFamily = cfg.fontFamily;
  totalRow.hidden = !cfg.showTotal;
  totalLabel.textContent = (cfg.totalName || 'Total Added').toUpperCase();
  totalVal.style.color = cfg.accentColor || '#2997ff';
  if (typeof cfg.totalCreditMs === 'number') {
    const mins = Math.floor(cfg.totalCreditMs / 60000);
    const txt = `${Math.floor(mins / 60)}h ${mins % 60}m`;
    totalVal.textContent = txt;
    totalRow.dataset.value = txt;
  }
}

function showPopup(deltaMs) {
  const allowPopup = typeof cfg.popup === 'boolean' ? cfg.popup : (popupOverride !== 'off');
  if (!allowPopup) return;
  const sec = Math.round(deltaMs / 1000);
  if (sec <= 0) return;
  if (toastTimer) clearTimeout(toastTimer);
  creditToast.textContent = `+${formatClock(sec)}`;
  creditToast.hidden = false;
  toastTimer = setTimeout(() => { toastTimer = null; creditToast.hidden = true; }, 2600);
}

async function fetchOverlayConfig() {
  try {
    const res = await fetch(`/api/overlay-config${obsScopeSuffix}`, { headers: { accept: 'application/json' }, cache: 'no-store' });
    if (res.ok) {
      const nextCfg = await res.json();
      if (nextCfg && typeof nextCfg === 'object') {
        cfg = { ...cfg, ...nextCfg };
        applyStyle();
      }
    }
  } catch { /* ignore transient offline */ }
}

applyStyle();

const streamQs = new URLSearchParams(obsScopeQs);
streamQs.set('role', 'obs');
const link = createTimerLink({
  streamUrl: `/api/stream?${streamQs.toString()}`,
  stateUrl: `/api/state${obsScopeSuffix}`,
  onHello: (info) => {
    const ver = info && typeof info.appVersion === 'string' ? info.appVersion : '';
    if (!ver) return;
    if (knownAppVersion && knownAppVersion !== ver) {
      // Stream Timer updated to a new version | auto-reload OBS Browser Source cleanly!
      window.location.reload();
      return;
    }
    knownAppVersion = ver;
  },
  onFreshness: (isFresh) => {
    if (isFresh) fetchOverlayConfig();
  },
  onFrame: (next) => {
    if (snap && next.revision > snap.revision) {
      const now = performance.now();
      const delta = (remainingAt(next, now) ?? 0) - (remainingAt(snap, now) ?? 0);
      if (delta >= 950) showPopup(delta);
    }
    snap = next;
  },
  onOverlay: (nextCfg) => { cfg = { ...cfg, ...nextCfg }; applyStyle(); },
});
fetchOverlayConfig();
link.start();

function tick() {
  const rem = remainingAt(snap, performance.now());
  countdown.textContent = formatClock(formatSeconds(rem ?? 0));
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
</body>
</html>
