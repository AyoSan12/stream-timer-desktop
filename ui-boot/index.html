<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stream Timer</title>
<style>
  :root {
    --bg: #f5f5f7;
    --fg: #1d1d1f;
    --muted: #6e6e73;
    --bar-bg: rgba(0, 0, 0, 0.08);
    --bar-fg: #0071e3;
    --mark-bg: #1d1d1f;
    --mark-fg: #ffffff;
    --border-soft: rgba(0, 0, 0, 0.08);
    --btn-bg: rgba(0, 0, 0, 0.06);
    --btn-fg: #1d1d1f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0b0d;
      --fg: #f5f5f7;
      --muted: #98989d;
      --bar-bg: rgba(255, 255, 255, 0.14);
      --bar-fg: #0a84ff;
      --mark-bg: #1c1c1e;
      --mark-fg: #ffffff;
      --border-soft: rgba(255, 255, 255, 0.09);
      --btn-bg: rgba(255, 255, 255, 0.12);
      --btn-fg: #f5f5f7;
    }
  }
  * { box-sizing: border-box; user-select: none; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--fg);
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
  }
  .tb {
    position: fixed; top: 0; left: 0; right: 0; height: 38px;
    padding: 0 8px 0 16px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .tb-brand {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 12px; font-weight: 600; color: var(--muted);
  }
  .tb-badge {
    width: 20px; height: 20px; border-radius: 6px;
    background: var(--fg); color: var(--bg);
    display: inline-flex; align-items: center; justify-content: center;
  }
  .tb-btn {
    width: 34px; height: 26px; border-radius: 7px; border: none;
    background: transparent; color: var(--muted); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    transition: background-color 140ms ease, color 140ms ease;
  }
  .tb-btn:hover { background: #ff453a; color: #ffffff; }
  .mark {
    width: 78px; height: 78px; border-radius: 22px;
    background: var(--mark-bg); color: var(--mark-fg);
    display: grid; place-items: center;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.22);
    animation: breathe 1.6s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.035); }
  }
  h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.025em; }
  .bar { width: 156px; height: 4px; border-radius: 999px; background: var(--bar-bg); overflow: hidden; position: relative; }
  .bar span {
    position: absolute; inset: 0 auto 0 0; width: 42%; border-radius: 999px;
    background: var(--bar-fg); animation: slide 1.15s cubic-bezier(0.4, 0, 0.2, 1) infinite;
  }
  @keyframes slide {
    0% { transform: translateX(-110%); }
    100% { transform: translateX(260%); }
  }
  p { margin: 0; font-size: 12.5px; color: var(--muted); max-width: 440px; text-align: center; line-height: 1.5; padding: 0 20px; }
  .err { color: #ff453a; font-weight: 500; }
  .actions { display: none; gap: 10px; margin-top: 6px; }
  .actions.show { display: flex; }
  .pill {
    border: none; border-radius: 999px; padding: 8px 18px;
    font-size: 13px; font-weight: 600; cursor: pointer;
    background: var(--btn-bg); color: var(--btn-fg);
  }
  .pill.primary { background: var(--bar-fg); color: #ffffff; }
</style>
</head>
<body>
  <div class="tb" id="bootTb">
    <div class="tb-brand">
      <span class="tb-badge" aria-hidden="true">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="13.2" r="7.8"/><path d="M12 9.2v4l2.7 1.6"/><path d="M9.5 2.4h5"/>
        </svg>
      </span>
      <span>Stream Timer</span>
    </div>
    <button id="quitTopBtn" class="tb-btn" type="button" aria-label="Close">
      <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
        <path d="M1.5 1.5l7 7M8.5 1.5l-7 7"/>
      </svg>
    </button>
  </div>

  <div class="mark" aria-hidden="true">
    <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="13.2" r="7.8"/>
      <path d="M12 9.2v4l2.7 1.6"/>
      <path d="M9.5 2.4h5"/>
      <path d="M17.8 6.4l1.4-1.4"/>
    </svg>
  </div>
  <h1>Stream Timer</h1>
  <div id="bootBar" class="bar" aria-hidden="true"><span></span></div>
  <p id="status">Starting local engine…</p>
  <div id="errActions" class="actions">
    <button id="retryBtn" class="pill primary" type="button">Retry</button>
    <button id="quitBtn" class="pill" type="button">Quit</button>
  </div>

  <script>
    let redirected = false;
    function invoke(cmd, args) {
      return window.__TAURI_INTERNALS__?.invoke?.(cmd, args);
    }

    // Reveal native window ONLY after first frame is painted -> 0ms white flash!
    requestAnimationFrame(() => requestAnimationFrame(() => {
      invoke('win_ready_show')?.catch(() => {});
    }));

    document.getElementById('bootTb').addEventListener('mousedown', (e) => {
      if (e.button === 0 && !e.target.closest('button')) invoke('win_start_dragging')?.catch(() => {});
    });

    function showError(msg) {
      const el = document.getElementById('status');
      el.className = 'err';
      el.textContent = msg;
      document.getElementById('bootBar').style.display = 'none';
      document.getElementById('errActions').classList.add('show');
    }
    window.__setBootError = showError;

    document.getElementById('quitTopBtn').addEventListener('click', () => invoke('app_quit')?.catch(() => {}));
    document.getElementById('quitBtn').addEventListener('click', () => invoke('app_quit')?.catch(() => {}));
    document.getElementById('retryBtn').addEventListener('click', () => {
      document.getElementById('status').className = '';
      document.getElementById('status').textContent = 'Restarting local engine…';
      document.getElementById('bootBar').style.display = '';
      document.getElementById('errActions').classList.remove('show');
      invoke('retry_engine_boot')?.catch(() => {});
    });

    async function pollStatus() {
      if (redirected) return;
      try {
        const res = await invoke('get_boot_status');
        if (res && res.state === 'ready' && res.url) {
          redirected = true;
          window.location.replace(res.url);
          return;
        }
        if (res && res.state === 'error' && res.error) {
          showError(res.error);
          return;
        }
      } catch {
        // IPC warming up
      }
      setTimeout(pollStatus, 80);
    }
    pollStatus();
  </script>
</body>
</html>
